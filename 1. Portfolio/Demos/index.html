<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>


    <section class="projects">

        <h2>My Creative Work</h2>

        <div class="projects-grid">

            <!-- IMAGE PROJECT -->
            <div class="project-card">
                <img src="/images/portfolio/portfolio-7.png" alt="">
                <div class="overlay">
                    <h3>Ice Cream Campaign</h3>
                    <p>Poster Design</p>
                </div>
            </div>

            <div class="project-card">
                <img src="/images/portfolio/portfolio-8.png" alt="">
                <div class="overlay">
                    <h3>Kulfi Branding</h3>
                    <p>Social Media Design</p>
                </div>
            </div>

            <div class="project-card">
                <img src="/images/portfolio/portfolio-9.png" alt="">
                <div class="overlay">
                    <h3>Pista Campaign</h3>
                    <p>Ad Creative</p>
                </div>
            </div>

            <div class="project-card">
                <img src="/images/portfolio/portfolio-13.png" alt="">
                <div class="overlay">
                    <h3>Strawberry Visual</h3>
                    <p>Creative Design</p>
                </div>
            </div>

            <!-- VIDEO PROJECT -->
            <div class="project-card video">
                <video src="/images/portfolio/portfolio-14.mp4"></video>
                <div class="overlay">
                    <h3>Product Promo Video</h3>
                    <p>Video Editing</p>
                </div>
            </div>

        </div>

    </section>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox">
        <span class="close">&times;</span>
        <img id="lightbox-img" alt="Expanded project preview">
        <video id="lightbox-video" controls></video>
    </div>




    <script src="script.js"></script>
</body>

</html>
