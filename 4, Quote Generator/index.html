<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>QuoteSpark — Multilingual Quote Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Space+Mono:wght@400;700&family=Noto+Sans+Gujarati:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <canvas id="bg-canvas"></canvas>
    <div class="bg-gradient"></div>

    <!-- FAVORITES OVERLAY -->
    <div class="fav-overlay" id="fav-overlay"></div>

    <!-- FAVORITES PANEL -->
    <div class="fav-panel" id="fav-panel">
        <div class="fav-header">
            <h2>Saved Quotes</h2>
            <button class="fav-close" id="fav-close">✕</button>
        </div>
        <div id="fav-list">
            <div class="fav-empty">No saved quotes yet.<br>Click ♡ on a quote to save it.</div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast-wrap" id="toast-wrap"></div>

    <!-- ════════════════════════ MAIN APP ════════════════════════ -->
    <div class="app">

        <!-- HEADER -->
        <header>
            <div class="brand">Quote<span>Spark</span></div>
            <div class="header-right">

                <!-- timer ring -->
                <div class="timer-ring" id="timer-ring" style="display:none">
                    <svg viewBox="0 0 38 38">
                        <circle class="tr-bg" cx="19" cy="19" r="15.5" />
                        <circle class="tr-fill" id="tr-fill" cx="19" cy="19" r="15.5" />
                    </svg>
                </div>

                <!-- auto toggle -->
                <div class="auto-wrap">
                    <label class="toggle">
                        <input type="checkbox" id="auto-toggle" />
                        <div class="toggle-track"></div>
                        <div class="toggle-thumb"></div>
                    </label>
                    <span>Auto</span>
                    <span class="timer-txt" id="timer-txt"></span>
                </div>

                <!-- TTS -->
                <button class="icon-btn speak-btn" id="speak-btn" title="Read aloud">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                    </svg>
                </button>

                <!-- favorites -->
                <button class="icon-btn" id="fav-open-btn" title="Saved quotes">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
                    </svg>
                    <span class="fav-badge" id="fav-badge"></span>
                </button>

                <!-- dark/light toggle -->
                <button class="icon-btn" id="theme-btn" title="Toggle theme">
                    <svg id="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5" />
                        <line x1="12" y1="1" x2="12" y2="3" />
                        <line x1="12" y1="21" x2="12" y2="23" />
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                        <line x1="1" y1="12" x2="3" y2="12" />
                        <line x1="21" y1="12" x2="23" y2="12" />
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                    </svg>
                </button>

            </div>
        </header>

        <!-- CONTROLS -->
        <div class="controls">
            <!-- language -->
            <div class="select-wrap">
                <select id="lang-select">
                    <option value="english">🇬🇧 English</option>
                    <option value="hindi">🇮🇳 Hindi</option>
                    <option value="gujarati">🏵️ Gujarati</option>
                    <option value="spanish">🇪🇸 Spanish</option>
                    <option value="french">🇫🇷 French</option>
                    <option value="arabic">🌙 Arabic</option>
                    <option value="japanese">🇯🇵 Japanese</option>
                </select>
            </div>

            <!-- category -->
            <div class="select-wrap">
                <select id="cat-select">
                    <option value="all">All Topics</option>
                    <option value="motivation">Motivation</option>
                    <option value="success">Success</option>
                    <option value="wisdom">Wisdom</option>
                    <option value="love">Love</option>
                    <option value="life">Life</option>
                    <option value="humor">Humor</option>
                </select>
            </div>
        </div>

        <!-- QUOTE CARD -->
        <div class="quote-card" id="quote-card">
            <div class="q-mark">"</div>
            <span class="lang-pill" id="lang-pill">English</span>
            <span class="q-num" id="q-num">#1</span>

            <div class="q-cat-pill" id="q-cat-pill">Motivation</div>
            <div class="q-text" id="q-text">Loading a beautiful quote for you...</div>
            <div class="q-author">
                <div class="q-author-line"></div>
                <div class="q-author-name" id="q-author">QuoteSpark</div>
            </div>

            <!-- card actions -->
            <div class="q-actions">
                <button class="q-action-btn" id="copy-btn" title="Copy">
                    <svg viewBox="0 0 24 24">
                        <rect x="9" y="9" width="13" height="13" rx="2" />
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                    </svg>
                    <span>Copy</span>
                </button>
                <button class="q-action-btn" id="tweet-btn" title="Tweet">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z" />
                    </svg>
                    <span>Tweet</span>
                </button>
                <button class="q-action-btn" id="share-btn" title="Share">
                    <svg viewBox="0 0 24 24">
                        <circle cx="18" cy="5" r="3" />
                        <circle cx="6" cy="12" r="3" />
                        <circle cx="18" cy="19" r="3" />
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
                    </svg>
                    <span>Share</span>
                </button>
                <button class="q-action-btn ml-auto" id="fav-btn" title="Save">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
                    </svg>
                    <span>Save</span>
                </button>
            </div>
        </div>

        <!-- GENERATE BUTTON -->
        <button class="gen-btn" id="gen-btn">
            <div class="gen-btn-inner" id="gen-btn-inner">
                <svg viewBox="0 0 24 24">
                    <polyline points="23 4 23 10 17 10" />
                    <polyline points="1 20 1 14 7 14" />
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
                </svg>
                Generate New Quote
            </div>
            <div class="loading-dots" id="gen-loading">
                <span></span><span></span><span></span>
            </div>
        </button>

        <!-- STATS -->
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-num" id="stat-total">0</div>
                <div class="stat-label">Quotes Available</div>
            </div>
            <div class="stat-item">
                <div class="stat-num" id="stat-generated">0</div>
                <div class="stat-label">Generated</div>
            </div>
            <div class="stat-item">
                <div class="stat-num" id="stat-saved">0</div>
                <div class="stat-label">Saved</div>
            </div>
            <div class="stat-item">
                <div class="stat-num" id="stat-langs">7</div>
                <div class="stat-label">Languages</div>
            </div>
        </div>

    </div><!-- /app -->

    <script src="script.js"></script>
</body>

</html>
